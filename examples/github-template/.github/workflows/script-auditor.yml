# Audits the third-party JavaScript of the pages in script-auditor.yml.
#
# Secrets (Settings > Secrets and variables > Actions):
#   OPENAI_API_KEY      for the LLM review
#   SLACK_WEBHOOK_URL   Slack incoming webhook for alerts
# Variables:
#   SCRIPT_AUDITOR_PAGES=true   to publish the status site with GitHub Pages
#                               (Settings > Pages > Source: GitHub Actions)
name: Script Auditor

on:
  schedule:
    # Every hour at minute 17 (GitHub delays runs at minute 0 most)
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Runs must not overlap: each one rewrites the data branch
concurrency:
  group: script-auditor
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # The audit data is kept on the script-auditor-data branch
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin a release tag or commit SHA of script-auditor here once one is published
      - uses: cihanandac/script-auditor@main
        with:
          config: script-auditor.yml
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Keep the status site with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status-site
          path: site
          retention-days: 7

      - name: Prepare the status site for GitHub Pages
        if: vars.SCRIPT_AUDITOR_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    needs: audit
    if: vars.SCRIPT_AUDITOR_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
