# Audits the third-party JavaScript of the pages in script-auditor.yml.
#
# Secrets (Settings > Secrets and variables > Actions):
#   OPENAI_API_KEY      for the LLM review
#   SLACK_WEBHOOK_URL   Slack incoming webhook for alerts
# Variables:
#   SCRIPT_AUDITOR_PAGES=true   to publish the status site with GitHub Pages
#                               (Settings > Pages > Source: GitHub Actions)
name: Script Auditor

on:
  schedule:
    # Every hour at minute 17 (GitHub delays runs at minute 0 most). In a private
    # repository on the free plan, every 2 hours fits the 2,000 monthly minutes.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Runs must not overlap: each one rewrites the data branch
concurrency:
  group: script-auditor
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pages-ready: ${{ steps.pages-artifact.outcome == 'success' }}
    permissions:
      # The audit data is kept on the script-auditor-data branch (and the README, if
      # enabled, is committed to the branch the workflow runs on)
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin a release tag or commit SHA of script-auditor here once one is published
      - uses: cihanandac/script-auditor@main
        with:
          config: script-auditor.yml
          # Write the findings into README.md, between <!-- script-auditor:start --> and
          # <!-- script-auditor:end -->, and commit it when they change
          # readme: README.md
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # The site is written before alerts are sent, so it is kept and published even when
      # the audit step failed (fail-on-alert, a notification error): that is when it matters
      - name: Keep the status site with the run
        if: ${{ !cancelled() && hashFiles('site/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status-site
          path: site
          retention-days: 7

      - name: Prepare the status site for GitHub Pages
        id: pages-artifact
        if: ${{ !cancelled() && vars.SCRIPT_AUDITOR_PAGES == 'true' && hashFiles('site/index.html') != '' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    needs: audit
    if: ${{ !cancelled() && needs.audit.outputs.pages-ready == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
